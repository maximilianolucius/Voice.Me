[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "voiceme-tts"
version = "0.22.0"
description = "Voice.Me - A deep learning toolkit for Text-to-Speech, battle-tested in research and production."
readme = "README.md"
license = {text = "MPL-2.0"}
requires-python = ">=3.9,<3.13"
authors = [
    {name = "Voice.Me Team", email = "info@voiceme.ai"},
]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "deep-learning",
    "voice-cloning",
    "voice-conversion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22.0",
    "cython>=0.29.30",
    "scipy>=1.11.2",
    "torch>=2.1",
    "torchaudio",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "numba>=0.57.0",
    "inflect>=5.6.0",
    "tqdm>=4.64.1",
    "anyascii>=0.3.0",
    "pyyaml>=6.0",
    "fsspec>=2023.6.0",
    "aiohttp>=3.8.1",
    "packaging>=23.1",
    "mutagen>=1.47.0",
    "flask>=2.0.1",
    "pysbd>=0.3.4",
    "umap-learn>=0.5.1",
    "pandas>=1.4",
    "matplotlib>=3.7.0",
    "trainer>=0.0.36",
    "coqpit>=0.0.16",
    "jieba",
    "pypinyin",
    "hangul_romanize",
    "gruut[de,es,fr]>=2.2.3",
    "jamo",
    "nltk",
    "g2pkk>=0.1.1",
    "bangla",
    "bnnumerizer",
    "bnunicodenormalizer",
    "einops>=0.6.0",
    "transformers>=4.33.0",
    "encodec>=0.1.1",
    "unidecode>=1.3.2",
    "num2words",
    "spacy[ja]>=3",
]

[project.optional-dependencies]
dev = [
    "black",
    "coverage",
    "isort",
    "pylint",
    "ruff",
    "pytest",
]
notebooks = [
    "bokeh>=2.0",
    "ipython",
]
japanese = [
    "mecab-python3",
    "unidic-lite",
]

[project.scripts]
voiceme-tts = "TTS.bin.synthesize:main"
voiceme-server = "TTS.server.server:main"

[project.urls]
Homepage = "https://github.com/voiceme-ai/Voice.Me"
Documentation = "https://voiceme.readthedocs.io"
Repository = "https://github.com/voiceme-ai/Voice.Me"
Issues = "https://github.com/voiceme-ai/Voice.Me/issues"

[tool.setuptools.packages.find]
include = ["TTS*"]

[tool.setuptools.package-data]
TTS = ["VERSION", ".models.json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
